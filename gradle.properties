# Shared box with limited free RAM: keep daemons small.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
# Compile Kotlin inside the Gradle daemon: one JVM instead of two on the RAM-tight box.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Project-local JDK (do not change system Java)
# JDK 21 is required: set JAVA_HOME, or org.gradle.java.home in ~/.gradle/gradle.properties.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
